'Custom.Template:Document.News':
  superTypes:
    'Custom.Template:Document.Page': true

  # Page Settings
  ui:
    label: 'News Article'
    icon: icon-newspaper
    position: 201
    group: 'news'
    help:
      message: 'Create A News Page'

    inspector:
      groups:
        newssettings:
          label: 'News-Einstellungen'
          position: 902
          icon: 'icon-newspaper'
  # no children pages
  constraints:
    nodeTypes:
      'Neos.Neos:Document': false


  # Allowed Content Elements
  childNodes:

    teaser: []

  # News Article Properties
  properties:
    source_name:
      type: string
      ui:
        label: 'news source'
        inspector:
          group: 'newssettings'

    author:
      type: string
      ui:
        label: 'news author'
        inspector:
          group: 'newssettings'
    url:
      type: string
      ui:
        label: 'news url'
        inspector:
          group: 'newssettings'
    title:
      validation:
        'Neos.Neos/Validation/StringLengthValidator':
          maximum: 80
    # publishedAt
    date:
      type: DateTime
      ui:
        label: 'News Datum'
        reloadIfChanged: true
        showInCreationDialog: true
        inspector:
          group: 'newssettings'
          position: 1
          editorOptions:
            format: 'd.m.Y'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': []
    # content
    teaser:
      type: string
      ui:
        label: 'News Teaser'
        reloadIfChanged: true
        showInCreationDialog: true
        inspector:
          group: 'newssettings'
          editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
          editorOptions:
            placeholder: 'News Teaser...(maximum 400 characters)'
          position: 1
      validation:
        'Neos.Neos/Validation/StringLengthValidator':
          maximum: 400

    description:
      type: string
      ui:
        label: 'News description'
        inspector:
          group: 'newssettings'

    image:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      ui:
        label: 'News Bild (3:1)'
        reloadIfChanged: true
        inspector:
          group: 'newssettings'
          editor: 'Neos.Neos/Inspector/Editors/ImageEditor'
          editorOptions:
            allowedExtensions: ['jpg', 'jpeg', 'png', 'gif', 'webp']
            crop:
              aspectRatio:
                locked:
                  width: 3
                  height: 1
    # hide in menus by default
    # @TODO: change it for Core 9.0
    _hiddenInIndex:
      type: string
      defaultValue: '1'

    categories:
      type: references
      ui:
        label: News Kategorie(n)
        inspector:
          group: newssettings
          editorOptions:
            nodeTypes: ['Custom.Template:Tag.Category']
            placeholder: 'Kategorie(n) auswählen'
            # threshold: 2
            # startingPoint: 'noes9/'
    tags:
      type: references
      ui:
        label: News Tag(s)
        inspector:
          group: newssettings
          editorOptions:
            nodeTypes: ['Custom.Template:Tag.Tag']
            placeholder: 'Tag(s) auswählen'
            # you find the start point by root page metadata: name: 'noes9'
            startingPoint: ''



  # DEMO Nodes
  options:
    template:
      childNodes:
        main:
          name: 'main'
          childNodes:
            content:
              type: 'Xp.Template:Content.Text'
              properties:
                text: ${'<p>Cras mattis consectetur purus sit amet fermentum. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi leo risus, porta ac consectetur ac, vestibulum at eros...</p>'}

