Custom.Template:Mixin.Content.Section:
  abstract: true
  superTypes:
    'Neos.Neos:Content': true
  ui:
    label: 'Custom Sections'
    icon: 'icon-layer-group'
    # group: structure
    position: 100
    inspector:
      tabs:
        section:
          label: 'Section'
          icon: 'icon-layer-group'
          position: 10
      groups:
        section:
          tab: section

  properties:

    widthOption:
      type: string
      search:
        indexing: false
      ui:
        label: 'Section Breite'
        reloadIfChanged: true
        inspector:
          group: section
          # hidden: 'ClientEval: q(node).parent().get(0).includes("main@") ? false : true'
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              '':
                label: 'Container 100%'
              'md:w-9/12':
                label: 'schmal (container 80%)'
              big:
                label: 'Gesamtbreite (voll)'


    styleOption:
      type: string
      search:
        indexing: false
      ui:
        label: 'Section Style'
        reloadIfChanged: true
        inspector:
          group: section
          # hidden: 'ClientEval: q(node).parent().get(0).includes("main@") ? false : true'
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              '':
                label: 'transparent'
              gray:
                label: 'grau'
              theme:
                label: 'Webseiten-Farbe'
              image:
                label: 'Hintergrundbild'

    backgroundOption:
      type: Neos\Media\Domain\Model\ImageInterface
      search:
        indexing: false
      ui:
        label: Hintergrundbild
        reloadIfChanged: true
        inspector:
          group: section
          # hidden: 'ClientEval: (node.properties.sectionStyle == "image" && q(node).parent().get(0).includes("main@")) ? false : true'
#          editorOptions:
#            required: false

    anchor:
      type: string
      ui:
        label: '#anker-link für Direktlinks'
        inspector:
          group: section
          # 当元素为子件时设置为隐藏
          # hidden: 'ClientEval: q(node).parent().get(0).includes("main@") ? false : true'
        help:
          message: 'Bitte nur Kleinbuchstaben und - verwenden'
      validation:
        'Neos.Neos/Validation/StringLengthValidator':
          maximum: 60
        'Neos.Neos/Validation/RegularExpressionValidator':
          regularExpression: '/^[a-z0-9\-]+$/'
      search:
        indexing: false

    sectionNavigation:
      type: boolean
      search:
        indexing: false
      ui:
        label: 'Show in Section Navigation'
        reloadIfChanged: true
        inspector:
          group: section
          # hidden: 'ClientEval: q(node).parent().get(0).includes("main@") ? false : true'

    sectionNavigationTitle:
      type: string
      search:
        indexing: false
      ui:
        label: 'Section Navigation Title'
        inspector:
          group: section
          # hidden: 'ClientEval:node.properties.sectionNavigation ? false : true'
          editorOptions:
            placeholder: 'ClientEval:node.properties.title'

    align:
      type: string
      search:
        indexing: false
      ui:
        label: 'align position'
        reloadIfChanged: true
        inspector:
          group: section
          # hidden: 'ClientEval: q(node).parent().get(0).includes("main@") ? false : true'
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              text-left:
                label: 'Default'
              text-right:
                label: 'Right'
              text-center:
                label: 'Center'
